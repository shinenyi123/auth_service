<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body class="auth-page">
    <nav class="site-nav">
        <a class="brand" href="/">Auth Service</a>
        <a href="/apps">My Apps</a>
    </nav>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Account recovery</p>
            <h1>Reset password</h1>
            <p class="intro">Verify your email before choosing a new password.</p>
            <p id="message" class="alert" role="alert" aria-live="polite"></p>
            <form id="reset-form">
                <label>Email <input id="email" type="email" placeholder="you@example.com" required
                        autocomplete="email"></label>
                <button type="button" id="request">Send OTP</button>
                <label id="otp-label" hidden>Verification code <input id="otp" inputmode="numeric" maxlength="6"
                        placeholder="6-digit code" hidden></label>
                <button type="button" id="verify" hidden>Verify OTP</button>
                <label id="password-label" hidden>New password <input id="password" type="password" minlength="8"
                        placeholder="At least 8 characters" hidden autocomplete="new-password"></label>
                <button type="submit" id="reset" hidden>Reset password</button>
            </form>
            <p class="auth-links"><a href="/login">Back to log in</a></p>
        </section>
    </main>
    <script>
        const message = document.querySelector('#message');
        const email = document.querySelector('#email');
        const otp = document.querySelector('#otp');
        const password = document.querySelector('#password');
        const otpLabel = document.querySelector('#otp-label');
        const passwordLabel = document.querySelector('#password-label');
        async function post(path, body) { const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || 'Request failed.'); return result; }
        document.querySelector('#request').onclick = async () => { try { await post('/api/forgot-password/request-otp', { email: email.value }); otp.hidden = false; otpLabel.hidden = false; document.querySelector('#verify').hidden = false; message.textContent = 'If the account exists, a code was sent.'; } catch (e) { message.textContent = e.message; } };
        document.querySelector('#verify').onclick = async () => { try { await post('/api/forgot-password/verify-otp', { email: email.value, otp_code: otp.value }); password.hidden = false; passwordLabel.hidden = false; document.querySelector('#reset').hidden = false; message.textContent = ''; } catch (e) { message.textContent = e.message; } };
        document.querySelector('#reset-form').onsubmit = async (event) => { event.preventDefault(); try { const result = await post('/api/forgot-password/set-password', { email: email.value, new_password: password.value }); window.location.href = result.redirect || '/login'; } catch (e) { message.textContent = e.message; } };
    </script>
</body>

</html>
