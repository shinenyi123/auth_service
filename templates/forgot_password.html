<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password</title>
</head>

<body>
    <h1>Reset password</h1>
    <p id="message" role="alert"></p>
    <form id="reset-form">
        <input id="email" type="email" placeholder="Email" required>
        <button type="button" id="request">Send OTP</button>
        <input id="otp" inputmode="numeric" maxlength="6" placeholder="OTP" hidden>
        <button type="button" id="verify" hidden>Verify OTP</button>
        <input id="password" type="password" minlength="8" placeholder="New password" hidden>
        <button type="submit" id="reset" hidden>Reset password</button>
    </form>
    <p><a href="/login">Back to log in</a></p>
    <script>
        const message = document.querySelector('#message');
        const email = document.querySelector('#email');
        const otp = document.querySelector('#otp');
        const password = document.querySelector('#password');
        async function post(path, body) { const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || 'Request failed.'); return result; }
        document.querySelector('#request').onclick = async () => { try { await post('/api/forgot-password/request-otp', { email: email.value }); otp.hidden = false; document.querySelector('#verify').hidden = false; message.textContent = 'If the account exists, a code was sent.'; } catch (e) { message.textContent = e.message; } };
        document.querySelector('#verify').onclick = async () => { try { await post('/api/forgot-password/verify-otp', { email: email.value, otp_code: otp.value }); password.hidden = false; document.querySelector('#reset').hidden = false; } catch (e) { message.textContent = e.message; } };
        document.querySelector('#reset-form').onsubmit = async (event) => { event.preventDefault(); try { const result = await post('/api/forgot-password/set-password', { email: email.value, new_password: password.value }); window.location.href = result.redirect || '/login'; } catch (e) { message.textContent = e.message; } };
    </script>
</body>

</html>
