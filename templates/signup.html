<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body class="auth-page">
    <nav class="site-nav">
        <a class="brand" href="/">Auth Service</a>
        <a href="/apps">My Apps</a>
    </nav>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Create your account</p>
            <h1>Sign up</h1>
            <p class="intro">Verify your email, then choose a password.</p>
            <p id="error" class="alert" role="alert" aria-live="polite"></p>
            <form id="signup-form">
                <label>Email <input id="email" type="email" placeholder="you@example.com" required
                        autocomplete="email"></label>
                <button type="button" id="request">Send OTP</button>
                <label id="otp-label" hidden>Verification code <input id="otp" inputmode="numeric" maxlength="6"
                        placeholder="6-digit code" hidden></label>
                <button type="button" id="verify" hidden>Verify OTP</button>
                <label id="password-label" hidden>Password <input id="password" type="password" minlength="8"
                        placeholder="At least 8 characters" hidden autocomplete="new-password"></label>
                <button type="submit" id="create" hidden>Create account</button>
            </form>
            <p class="auth-links"><a href="/login">Already have an account? Log in</a></p>
        </section>
    </main>
    <script>
        const error = document.querySelector('#error');
        const email = document.querySelector('#email');
        const otp = document.querySelector('#otp');
        const password = document.querySelector('#password');
        const otpLabel = document.querySelector('#otp-label');
        const passwordLabel = document.querySelector('#password-label');
        const requestButton = document.querySelector('#request');
        const verifyButton = document.querySelector('#verify');
        const createButton = document.querySelector('#create');
        const context = new URLSearchParams(window.location.search);
        const contextPayload = () => ({
            client_id: context.get('client_id') || undefined,
            redirect_uri: context.get('redirect_uri') || undefined,
            state: context.get('state') || undefined,
        });
        async function post(path, body) {
            const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Request failed.');
            return result;
        }
        requestButton.onclick = async () => { try { await post('/api/signup/request-otp', { email: email.value, ...contextPayload() }); otp.hidden = false; otpLabel.hidden = false; verifyButton.hidden = false; error.textContent = ''; } catch (e) { error.textContent = e.message; } };
        verifyButton.onclick = async () => { try { await post('/api/signup/verify-otp', { email: email.value, otp_code: otp.value }); password.hidden = false; passwordLabel.hidden = false; createButton.hidden = false; error.textContent = ''; } catch (e) { error.textContent = e.message; } };
        document.querySelector('#signup-form').onsubmit = async (event) => { event.preventDefault(); try { const result = await post('/api/signup/set-password', { email: email.value, password: password.value }); window.location.href = result.redirect || '/'; } catch (e) { error.textContent = e.message; } };
    </script>
</body>

</html>
