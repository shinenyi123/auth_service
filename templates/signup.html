<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
</head>

<body>
    <nav><a href="/apps">My Apps</a></nav>
    <h1>Sign up</h1>
    <p id="error" role="alert"></p>
    <form id="signup-form">
        <input id="email" type="email" placeholder="Email" required>
        <button type="button" id="request">Send OTP</button>
        <input id="otp" inputmode="numeric" maxlength="6" placeholder="OTP" hidden>
        <button type="button" id="verify" hidden>Verify OTP</button>
        <input id="password" type="password" minlength="8" placeholder="Password" hidden>
        <button type="submit" id="create" hidden>Create account</button>
    </form>
    <p><a href="/login">Log in</a></p>
    <script>
        const error = document.querySelector('#error');
        const email = document.querySelector('#email');
        const otp = document.querySelector('#otp');
        const password = document.querySelector('#password');
        const requestButton = document.querySelector('#request');
        const verifyButton = document.querySelector('#verify');
        const createButton = document.querySelector('#create');
        const context = new URLSearchParams(window.location.search);
        const contextPayload = () => ({
            client_id: context.get('client_id') || undefined,
            redirect_uri: context.get('redirect_uri') || undefined,
            state: context.get('state') || undefined,
        });
        async function post(path, body) {
            const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Request failed.');
            return result;
        }
        requestButton.onclick = async () => { try { await post('/api/signup/request-otp', { email: email.value, ...contextPayload() }); otp.hidden = false; verifyButton.hidden = false; } catch (e) { error.textContent = e.message; } };
        verifyButton.onclick = async () => { try { await post('/api/signup/verify-otp', { email: email.value, otp_code: otp.value }); password.hidden = false; createButton.hidden = false; } catch (e) { error.textContent = e.message; } };
        document.querySelector('#signup-form').onsubmit = async (event) => { event.preventDefault(); try { const result = await post('/api/signup/set-password', { email: email.value, password: password.value }); window.location.href = result.redirect || '/'; } catch (e) { error.textContent = e.message; } };
    </script>
</body>

</html>
