<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
</head>

<body>
    <h1>Log in</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
        <input type="hidden" name="client_id" value="{{ client_id | default(request.args.get('client_id', '')) }}">
        <input type="hidden" name="redirect_uri"
            value="{{ redirect_uri | default(request.args.get('redirect_uri', '')) }}">
        <input type="hidden" name="state" value="{{ state | default(request.args.get('state', '')) }}">
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Log in</button>
    </form>
    <p><a href="/signup">Create an account</a> | <a href="/forgot-password">Forgot password?</a></p>
</body>

</html>
