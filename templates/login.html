<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body class="auth-page">
    <nav class="site-nav">
        <a class="brand" href="/">Auth Service</a>
        <a href="/websites">My Websites</a>
    </nav>
    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in</h1>
            <p class="intro">Use your Auth Service account to continue.</p>
            {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
            <form method="post" action="/login">
                <label>Email <input name="email" type="email" required autocomplete="email"></label>
                <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
                <button type="submit">Log in</button>
            </form>
            <p class="auth-links"><a href="/signup">Create an account</a><a href="/forgot-password">Forgot password?</a>
            </p>
        </section>
    </main>
</body>

</html>
