<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Websites</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body>
    <nav class="site-nav">
        <a class="brand" href="/websites">Auth Service</a>
        <form class="logout-form" method="post" action="/logout">
            <button type="submit">Log out</button>
        </form>
    </nav>

    <main class="apps-shell">
        <section class="apps-card">
            <header>
                <div>
                    <p class="eyebrow">Your workspace</p>
                    <h1>My Websites</h1>
                    <p class="intro">Welcome, {{ email }}.</p>
                </div>
            </header>

            <section class="app-section" aria-labelledby="websites-heading">
                <h2 id="websites-heading">Websites you can access</h2>
                <ul class="app-list">
                    <li><a class="app-link" href="https://student-dashboard-v2.onrender.com/auth/login">Student
                            Dashboard</a></li>
                </ul>
            </section>
        </section>
    </main>
</body>

</html>
