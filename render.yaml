services:
  - type: web
    name: shared-auth-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_API_URL
        value: https://api.resend.com/emails
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: PRIVATE_KEY_PATH
        sync: false
      - key: PUBLIC_KEY_PATH
        sync: false
